{% assign current = page.url %}
<header class="site-header glass" id="site-header">
  <nav class="site-nav">
    <!-- 左：品牌。收缩时文字折叠，只留缩小的头像 -->
    <a class="brand {% if current == "/" %}active{% endif %}" href="{{ "/" | relative_url }}">
      <img class="brand-avatar" src="{{ "/assets/images/avatar.jpg" | relative_url }}"
           alt="" width="26" height="26">
      <span class="brand-text">{{ site.title }}</span>
    </a>

    <!-- 中：导航链接。桌面端随滚动折叠；移动端变为汉堡面板 -->
    <div class="nav-links" id="nav-links">
      <a href="{{ "/posts/" | relative_url }}" class="{% if current contains "/posts/" or page.layout == "post" %}active{% endif %}">文章</a>
      <a href="{{ "/tags/" | relative_url }}" class="{% if current == "/tags/" %}active{% endif %}">标签</a>
      <a class="nav-about {% if current == "/about/" %}active{% endif %}" href="{{ "/about/" | relative_url }}">关于</a>
      <!-- 桌面隐藏（原样）；移动端作为面板最后一行 -->
      <a class="nav-theme-link {% if current == "/theme/" %}active{% endif %}" href="{{ "/theme/" | relative_url }}">设置</a>
    </div>

    <!-- 中：音乐区（本页有音轨时才出现）。播放期间顶掉上面 .nav-links 的位置，
         两侧图标（头像 / 搜索 / 设置或汉堡）全部保留，形态对齐 iOS 灵动岛。
         必须是 .site-nav 的直接子元素，理由同下面的 .nav-search：放进 .nav-links
         会被移动端汉堡面板吞掉，放进 .theme-menu 会跟着 display:none 一起消失。
         两个 .audio-toggle 图标是全站唯一真源 —— audio-player.js 用 cloneNode
         取它们给文章内播放器用，省得同一份路径在 JS 里再写一遍。
         显隐走 CSS 的 max-width 过渡，这里不写 hidden 属性（那会让胶囊宽度硬跳） -->
    <div class="nav-music" id="nav-music" role="group" aria-label="正在播放">
      <svg class="nav-music-note" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
           aria-hidden="true" focusable="false">
        <path d="M9 18V6l10-2v12"></path>
        <circle cx="6.5" cy="18" r="2.5"></circle>
        <circle cx="16.5" cy="16" r="2.5"></circle>
      </svg>
      <span class="nav-music-title" id="nav-music-title"></span>
      <button type="button" class="audio-toggle" id="nav-music-toggle" aria-label="播放">
        <svg class="ico-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
          <path d="M7 4.5v15l13-7.5z"></path>
        </svg>
        <svg class="ico-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
          <path d="M7 4h3.5v16H7zM13.5 4H17v16h-3.5z"></path>
        </svg>
      </button>
      <input type="range" class="audio-progress" id="nav-music-progress"
             min="0" max="1000" step="1" value="0" aria-label="播放进度">
      <!-- ✕：停止播放 + 进度归零 + 收起音乐区。作用于「当前音轨」，文章里的音轨
           与背景音乐共用这一条。刻意不挂 .audio-toggle 类——那会继承
           .ico-play/.ico-pause 的显隐规则，语义会串 -->
      <button type="button" class="nav-music-stop" id="nav-music-stop" aria-label="停止播放">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" aria-hidden="true" focusable="false">
          <path d="M6 6l12 12M18 6L6 18"></path>
        </svg>
      </button>
    </div>

    <!-- 中：选歌（背景音乐）。常驻显示，未播放时也能点；视觉顺序是 ♪ 🔍 🎨。
         必须是 .site-nav 的直接子元素（理由同下面的 .nav-search），且紧贴
         .nav-search 之前 —— music.css 用相邻兄弟选择器让它接手移动端那份
         margin-left:auto，把 ♪🔍☰ 成组推到右侧。
         音符图标刻意不复用上面那个双音符：两个音符挨在一起会分不清
         哪个是入口、哪个是状态 -->
    <button type="button" class="nav-music-picker" id="nav-music-picker"
            aria-haspopup="menu" aria-expanded="false"
            aria-controls="nav-music-layer" aria-label="背景音乐" title="背景音乐">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M4 6h11M4 11h7M4 16h7"></path>
        <circle cx="17" cy="16" r="3"></circle>
        <path d="M20 16V7l-3 .9"></path>
      </svg>
    </button>

    <!-- 搜索：静止是一个 34px 圆点，点击拉伸成输入框（iOS 26 风格）。
         必须是 .site-nav 的直接子元素——放进 .nav-links 会在移动端被汉堡面板吞掉，
         放进 .theme-menu 会跟着移动端 display:none 一起消失 -->
    <div class="nav-search" id="nav-search">
      <button type="button" class="nav-search-toggle" id="nav-search-toggle"
              aria-label="搜索文章" aria-expanded="false" aria-controls="nav-search-layer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" aria-hidden="true" focusable="false">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="16.2" y1="16.2" x2="21" y2="21"></line>
        </svg>
      </button>
      <input type="search" class="nav-search-input" id="nav-search-input"
             placeholder="搜索文章…" aria-label="搜索文章" autocomplete="off">
      <button type="button" class="nav-search-close" id="nav-search-close" aria-label="关闭搜索">✕</button>
    </div>

    <!-- 右：主题菜单（桌面）。触发器只留调色盘图标，无障碍名由 aria-label 承担；
         尺寸/颜色/hover/focus 与左侧 .nav-search-toggle 逐像素一致。
         .theme-menu-trigger 类名与 aria-expanded 由 theme-menu.js 依赖，不可改 -->
    <div class="theme-menu" id="theme-menu">
      <button type="button" class="theme-menu-trigger" id="theme-menu-trigger"
              aria-haspopup="menu" aria-expanded="false"
              aria-label="主题设置" title="主题设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M12 22a1 1 0 0 1 0-20 10 9 0 0 1 10 9 5 5 0 0 1-5 5h-2.25a1.75 1.75 0 0 0-1.4 2.8l.3.4a1.75 1.75 0 0 1-1.4 2.8z"></path>
          <circle cx="13.5" cy="6.5" r=".5"></circle>
          <circle cx="17.5" cy="10.5" r=".5"></circle>
          <circle cx="6.5" cy="12.5" r=".5"></circle>
          <circle cx="8.5" cy="7.5" r=".5"></circle>
        </svg>
      </button>
      <div class="theme-menu-panel" role="menu" aria-labelledby="theme-menu-trigger">
        <div class="theme-menu-item" role="menuitem" tabindex="0">
          颜色模式
          <span class="theme-menu-caret" aria-hidden="true">▸</span>
          <div class="theme-menu-sub" role="group" aria-label="颜色模式选项">
            <button type="button" data-theme="light" aria-pressed="false">浅色</button>
            <button type="button" data-theme="dark" aria-pressed="false">深色</button>
            <button type="button" data-theme="auto" aria-pressed="false">自动</button>
          </div>
        </div>
        <div class="theme-menu-item" role="menuitem" tabindex="0">
          透明模式
          <span class="theme-menu-caret" aria-hidden="true">▸</span>
          <div class="theme-menu-sub" role="group" aria-label="透明模式选项">
            <button type="button" data-style="liquid" aria-pressed="false">液态</button>
            <button type="button" data-style="frost" aria-pressed="false">模糊</button>
            <button type="button" data-style="solid" aria-pressed="false">纯色</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 右：汉堡按钮（仅移动端显示） -->
    <button type="button" class="nav-toggle" id="nav-toggle"
            aria-label="导航菜单" aria-expanded="false" aria-controls="nav-links">
      <span class="nav-toggle-bar" aria-hidden="true"></span>
      <span class="nav-toggle-bar" aria-hidden="true"></span>
      <span class="nav-toggle-bar" aria-hidden="true"></span>
    </button>
  </nav>
</header>

<!-- 背景音乐选歌面板。与下面的 #nav-search-layer 同理放在 <header> 之外：
     header 自身带 backdrop-filter，它既是 position:fixed 后代的包含块（面板会以
     header 而非视口为基准定位），又会让面板的模糊以「已模糊的父层」为背景而发浑。
     移动端还多一条理由——≤768px 时 .site-nav 是 overflow:hidden 的裁剪层，
     挂在胶囊内部的下拉面板会被整个裁掉。
     位置由 music-menu.js 实测胶囊底边后写入 --nav-music-top。
     曲目由 JS 从 /music.json 拉取后渲染，这里只留空壳 -->
<div class="nav-music-layer" id="nav-music-layer">
  <div class="nav-music-panel">
    <p class="nav-music-status" id="nav-music-status" role="status" aria-live="polite"></p>
    <div class="nav-music-list" id="nav-music-list" role="menu"
         aria-labelledby="nav-music-picker"></div>
    <p class="nav-music-hint">离开本页会停止播放</p>
  </div>
</div>

<!-- 背景音乐的播放宿主。
     ★ 必须是**文档里**的元素，不能用 new Audio()：媒体事件不冒泡，整个
       audio-player.js 靠 document 捕获阶段委托；游离元素的事件根本到不了
       document —— 顶栏音乐区、多音轨互斥（pauseOthers 用 getElementsByTagName）、
       MediaSession 三样全会失效。
     ★ 必须放在 <main> 之外：initPlayers() 只扫 main audio，放进去会被建壳成
       一个可见的文章播放器。
     ★ 不带 controls、不写 src：纯播放宿主，UI 全在顶栏音乐区；没选歌之前
       一个请求都不发。
     ★ data-playlist 是与 audio-player.js 的约定：ended/error 时它不停表、
       不收顶栏，续播交给 music-menu.js（两边注释互相引用） -->
<audio class="nav-music-audio" id="nav-music-audio" data-playlist preload="metadata"></audio>

<!-- 顶栏搜索结果面板。
     刻意放在 <header> 之外：header 自身带 backdrop-filter，它既是 position:fixed
     后代的包含块（面板会以 header 而非视口为基准定位），又会让面板的模糊以
     「已模糊的父层」为背景而显得浑浊。放到外面才能拿到真正的高斯模糊。
     面板位置由 search.js 实测胶囊底边后写入 --nav-search-top -->
<div class="nav-search-layer" id="nav-search-layer">
  <div class="nav-search-panel" role="region" aria-label="搜索结果">
    <p class="nav-search-status" id="nav-search-status" role="status" aria-live="polite"></p>
    <div class="nav-search-results" id="nav-search-results"></div>
  </div>
</div>
