---
layout: default
---
<article class="post">
  <h1>{{ page.title }}</h1>
  <div class="post-tags">{{ page.tags | join: ", " }}</div>
  {% if page.d %}<p class="post-d">{{ page.d }}</p>{% endif %}
  <time class="post-date">{{ page.date | date: site.date_format }}</time>
  <div class="post-content">
    {{ content }}
  </div>
</article>
